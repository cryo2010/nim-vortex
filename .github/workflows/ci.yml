name: CI

# pull_request gates PRs; push only fires for main (a PR merge is a push
# to main), giving a post-merge run without duplicating the PR check.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch Linux ships OpenSSL 3.6; the TLS/HTTP2/HTTP3 tests need OpenSSL
    # >= 3.5 for the QUIC server API, which stock Ubuntu runners lack. The
    # HTTP/3 integration tests skip themselves when no HTTP/3-capable curl
    # is present, so they are effectively h1 + h2 + TLS here.
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        mm: [orc, arc]         # memory managers; orc is the recommended one
    env:
      NIM_MM: ${{ matrix.mm }}   # tests/config.nims reads this
    steps:
      - name: Install toolchain
        # --disable-sandbox: pacman's Landlock sandbox cannot apply in a
        # container.
        run: >-
          pacman -Syu --noconfirm --needed --disable-sandbox
          nim gcc git curl openssl

      - uses: actions/checkout@v7

      - name: Nim version
        run: nim --version

      - name: Run unit tests
        run: nimble test -y

      - name: Build zero-dependency variant
        run: >-
          nim c --mm:${{ matrix.mm }} --threads:on -d:plainHttp
          -o:/tmp/vortex_plain src/vortex.nim

  testchronos:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: >-
          pacman -Syu --noconfirm --needed --disable-sandbox
          nim gcc git curl openssl
      - uses: actions/checkout@v7
      - name: Test the chronos adapter
        # chronos is an opt-in dependency kept out of the default nimble
        # test; this installs it and runs the adapter's own suite (orc).
        run: nimble testchronos -y

  # The REDbot and fuzz checks ship as Docker images (bundling REDbot and
  # the libFuzzer runtime). These jobs run on the plain runner, where
  # Docker is available, so they exercise the images themselves. The image
  # base defaults to arm64, so override it for the x86_64 runners. Each
  # tool exits non-zero on a finding, which fails the job.
  redbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HTTP/1.1 conformance (REDbot)
        run: |
          docker build -f conformance/Dockerfile -t vortex-redbot \
            --build-arg BASE=archlinux:latest .
          docker run --rm vortex-redbot

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fuzz the parser/HPACK/QPACK decoders
        # 30s per target; a crash writes a reproducer and exits non-zero.
        run: |
          docker build -f fuzz/Dockerfile -t vortex-fuzz \
            --build-arg BASE=archlinux:latest .
          docker run --rm -e DUR=30 vortex-fuzz

  autobahn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: WebSocket conformance (Autobahn)
        # run.sh builds a vortex echo server image, runs the
        # crossbario/autobahn-testsuite fuzzingclient against it, and exits
        # non-zero on any failing case. It picks the x86_64 image base
        # itself; python3 (for the report) is preinstalled on the runner.
        run: sh conformance/autobahn/run.sh

  h2spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HTTP/2 conformance (h2spec over TLS)
        # run.sh builds a vortex HTTP/2-over-TLS server image and runs the
        # summerwind/h2spec image against it; h2spec exits non-zero on any
        # failed test.
        run: sh conformance/h2spec/run.sh
