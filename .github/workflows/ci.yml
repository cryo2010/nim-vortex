name: CI

# pull_request gates PRs; push only fires for main (a PR merge is a push
# to main), giving a post-merge run without duplicating the PR check.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch Linux ships OpenSSL 3.6; the TLS/HTTP2/HTTP3 tests need OpenSSL
    # >= 3.5 for the QUIC server API, which stock Ubuntu runners lack. Arch's
    # curl also has HTTP/3, so the h3 integration tests run here too.
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        mm: [orc, arc]         # memory managers; orc is the recommended one
    env:
      NIM_MM: ${{ matrix.mm }}   # tests/config.nims reads this
      NIM_COMPRESS: "1"          # build gzip/brotli/zstd so those tests run
    steps:
      - name: Install toolchain
        # --disable-sandbox: pacman's Landlock sandbox cannot apply in a
        # container. zlib/brotli/zstd provide the compression libs + CLIs the
        # compression tests link and decode with.
        run: >-
          pacman -Syu --noconfirm --needed --disable-sandbox
          nim gcc git curl openssl zlib brotli zstd libngtcp2 libnghttp3

      - uses: actions/checkout@v7

      - name: Nim version
        run: nim --version

      - name: Run unit tests
        # Run the suite directly (not `nimble test`): nimble does not reliably
        # propagate a task's exit code (nim-lang/nimble#1802), so a failing test
        # would still exit 0 and report green. tests/run.sh runs `nim c -r` per
        # suite under `set -e`, so the first failure fails the job.
        run: bash tests/run.sh

      - name: Build zero-dependency variant
        run: >-
          nim c --mm:${{ matrix.mm }} --threads:on -d:plainHttp
          -o:/tmp/vortex_plain src/vortex.nim

  sanitize:
    runs-on: ubuntu-latest
    # Privileged so we can lower the host's mmap randomization (see below);
    # arch for OpenSSL >= 3.5, like the test job.
    container:
      image: archlinux:latest
      options: --privileged
    env:
      NIM_SANITIZE: "1"          # tests/config.nims adds -fsanitize=address,undefined
      NIM_COMPRESS: "1"          # ASan-cover the gzip/brotli/zstd paths too
      ASAN_OPTIONS: detect_leaks=0:detect_container_overflow=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Lower ASLR entropy for AddressSanitizer
        # GitHub's Ubuntu 24.04 host kernel uses high mmap randomization, which
        # breaks ASan's shadow-memory mapping; 28 bits is the documented value.
        run: sysctl -w vm.mmap_rnd_bits=28 || true
      - name: Install toolchain
        run: >-
          pacman -Syu --noconfirm --needed --disable-sandbox
          nim gcc git curl openssl zlib brotli zstd libngtcp2 libnghttp3
      - uses: actions/checkout@v7
      - name: Run the test suite under ASan + UBSan
        # Extends the fuzzer's ASan coverage from the parser targets to the whole
        # server (event loop, h2/h3 codecs, worker pool). A memory or UB error
        # fails the job. Direct via tests/run.sh (not `nimble test`) so a failure
        # is not masked by nim-lang/nimble#1802.
        run: bash tests/run.sh

  testchronos:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: >-
          pacman -Syu --noconfirm --needed --disable-sandbox
          nim gcc git curl openssl libngtcp2 libnghttp3
      - uses: actions/checkout@v7
      - name: Test the chronos adapter
        # chronos is an opt-in dependency kept out of the default suite; install
        # it, then build/run the adapter's suite directly (orc). Not via
        # `nimble testchronos`: a failure there would be masked by
        # nim-lang/nimble#1802. The raw `nim c` resolves chronos from the global
        # nimble package path.
        run: |
          nimble install -y "chronos@>= 4.0.0"
          nim c -r --mm:orc --threads:on -d:ssl -p:src \
            -o:tests/chronos_adapter tests/chronos_adapter.nim

  testdeflate:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: >-
          pacman -Syu --noconfirm --needed --disable-sandbox
          nim gcc openssl zlib libngtcp2 libnghttp3
      - uses: actions/checkout@v7
      - name: Test WebSocket permessage-deflate
        # Opt-in -d:wsDeflate feature (links zlib), so its suite is separate
        # from the default suite. Built/run directly (not `nimble testdeflate`)
        # so a failure is not masked by nim-lang/nimble#1802. The h2 (RFC 8441)
        # suite gains a permessage-deflate case under the flag.
        run: |
          nim c -r --mm:orc --threads:on -d:ssl -d:wsDeflate --passL:-lz -p:src \
            -o:tests/websocket_deflate tests/websocket_deflate.nim
          nim c -r --mm:orc --threads:on -d:ssl -d:wsDeflate --passL:-lz -p:src \
            -o:tests/test_http2_websocket tests/test_http2_websocket.nim

  teststreamcomp:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        # brotli provides libbrotlienc/dec + the brotli CLI; curl (with brotli)
        # and the CLIs decode the streamed responses.
        run: >-
          pacman -Syu --noconfirm --needed --disable-sandbox
          nim gcc openssl zlib brotli curl libngtcp2 libnghttp3
      - uses: actions/checkout@v7
      - name: Test streaming response compression (gzip + brotli)
        # res.sendHead/write/finish (SSE, file streaming) compressed with gzip
        # and brotli over HTTP/1.1 (chunked) and h2c; byte-exact round-trip.
        # Built/run directly (not `nimble teststreamcomp`) so a failure is not
        # masked by nim-lang/nimble#1802.
        run: >-
          nim c -r --mm:orc --threads:on -d:ssl -d:httpGzip -d:httpBrotli
          --passL:-lz --passL:"-lbrotlienc -lbrotlicommon" -p:src
          -o:tests/test_streaming_compression tests/test_streaming_compression.nim

  testreqdecomp:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: >-
          pacman -Syu --noconfirm --needed --disable-sandbox
          nim gcc openssl zlib brotli zstd curl libngtcp2 libnghttp3
      - uses: actions/checkout@v7
      - name: Test request-body decompression (gzip + brotli + zstd)
        # Inbound gzip/br/zstd request bodies decoded into req.body, bounded by
        # maxBodySize: decode round-trips over h1 + h2c, a bomb -> 413, corrupt
        # -> 400. Built/run directly (not `nimble testreqdecomp`) so a failure is
        # not masked by nim-lang/nimble#1802.
        run: >-
          nim c -r --mm:orc --threads:on -d:ssl -d:httpGzip -d:httpBrotli
          -d:httpZstd --passL:-lz
          --passL:"-lbrotlienc -lbrotlidec -lbrotlicommon" --passL:-lzstd -p:src
          -o:tests/test_request_decompression tests/test_request_decompression.nim

  testzstd:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        # zstd/brotli provide the encoders + CLIs; curl fetches, the CLIs decode.
        run: >-
          pacman -Syu --noconfirm --needed --disable-sandbox
          nim gcc openssl zlib brotli zstd curl libngtcp2 libnghttp3
      - uses: actions/checkout@v7
      - name: Test zstd response compression
        # Buffered + streamed zstd over HTTP/1.1 and h2c, plus br/zstd/gzip
        # Accept-Encoding negotiation; byte-exact round-trip. Built/run directly
        # (not `nimble testzstd`) so a failure is not masked by
        # nim-lang/nimble#1802.
        run: >-
          nim c -r --mm:orc --threads:on -d:ssl -d:httpGzip -d:httpBrotli
          -d:httpZstd --passL:-lz --passL:"-lbrotlienc -lbrotlicommon"
          --passL:-lzstd -p:src
          -o:tests/test_zstd_compression tests/test_zstd_compression.nim

  testrace:
    runs-on: ubuntu-latest
    # Privileged to lower the host's mmap randomization for ThreadSanitizer's
    # shadow mapping (same reason as the sanitize job); arch for a modern gcc.
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sysctl -w vm.mmap_rnd_bits=28 || true
      - name: Install toolchain
        run: >-
          pacman -Syu --noconfirm --needed --disable-sandbox
          nim gcc git
      - uses: actions/checkout@v7
      - name: ThreadSanitizer handler-race regression
        # Builds the start()/shutdown and blocking-request stress under TSan;
        # TSan aborts on any data race, failing the job. Guards the
        # handler/stream-route closure being stored as a raw (proc, env) pair
        # instead of a traced ref that would race its ORC refcount across loop
        # threads. -d:plainHttp keeps OpenSSL out of the report; -d:useMalloc
        # lets TSan see all allocations. Built/run directly (not
        # `nimble testrace`) so a failure is not masked by nim-lang/nimble#1802.
        env:
          TSAN_OPTIONS: halt_on_error=1:abort_on_error=1
        run: |
          for t in test_thread_race test_blocking_race; do
            nim c -r --mm:orc --threads:on -d:plainHttp -d:useMalloc \
              --passC:-fsanitize=thread --passL:-fsanitize=thread \
              --debugger:native -p:src -o:tests/$t tests/$t.nim
          done

  # The REDbot and fuzz checks ship as Docker images (bundling REDbot and
  # the libFuzzer runtime). These jobs run on the plain runner, where
  # Docker is available, so they exercise the images themselves. The image
  # base defaults to arm64, so override it for the x86_64 runners. Each
  # tool exits non-zero on a finding, which fails the job.
  redbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HTTP/1.1 conformance (REDbot)
        run: |
          docker build -f conformance/Dockerfile -t vortex-redbot \
            --build-arg BASE=archlinux:latest .
          docker run --rm vortex-redbot

  h1spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HTTP/1.1 conformance (h1spec)
        # run.sh builds a plaintext vortex HTTP/1.1 server image and a pinned
        # dropseed/h1spec client image, then runs h1spec against it over a
        # private docker network; h1spec exits non-zero on any failing case.
        # It picks the x86_64 server base itself.
        run: sh conformance/h1spec/run.sh

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fuzz the parser/HPACK decoders
        # 30s per target; a crash writes a reproducer and exits non-zero.
        run: |
          docker build -f fuzz/Dockerfile -t vortex-fuzz \
            --build-arg BASE=archlinux:latest .
          docker run --rm -e DUR=30 vortex-fuzz

  # The Autobahn job is paused: it runs ~11 min per PR, dominated by the
  # permessage-deflate cases (12-13 are ~96% of the case time). The harness
  # still runs locally via `nimble autobahn`, and WebSocket protocol
  # correctness is guarded by the unit suites (test_websocket_*).
  #
  # Re-enable plan: move it off the per-PR path -- either a nightly
  # `schedule:` run or a `workflow_dispatch` / label-gated trigger -- and/or
  # cache the testsuite image (buildx GHA cache) to cut the build/pull cost.
  #
  # autobahn:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: WebSocket conformance (Autobahn)
  #       # run.sh builds a vortex echo server image, runs the
  #       # crossbario/autobahn-testsuite fuzzingclient against it, and exits
  #       # non-zero on any failing case. It picks the x86_64 image base
  #       # itself; python3 (for the report) is preinstalled on the runner.
  #       run: sh conformance/autobahn/run.sh

  h2spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HTTP/2 conformance (h2spec over TLS)
        # run.sh builds a vortex HTTP/2-over-TLS server image and runs the
        # summerwind/h2spec image against it; h2spec exits non-zero on any
        # failed test.
        run: sh conformance/h2spec/run.sh

  h3websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HTTP/3 WebSocket conformance (RFC 9220, aioquic)
        # run.sh builds a vortex h3 WebSocket echo server image (archlinux for
        # OpenSSL >= 3.5) and an aioquic client image, then runs the client
        # against the server over a private docker network; the aioquic client
        # exits non-zero on any handshake/echo mismatch. It picks the x86_64
        # server base itself.
        run: sh conformance/h3websocket/run.sh

  h3spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HTTP/3 conformance (h3spec, HTTP/3-servers group)
        # run.sh builds a vortex h3 server image and an h3spec client image,
        # then runs h3spec's HTTP/3 + QPACK error-case group against it;
        # h3spec exits non-zero on any failure. The QUIC transport group is
        # OpenSSL's stack (not vortex) and is excluded.
        run: sh conformance/h3spec/run.sh

  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Security scan (OWASP ZAP baseline)
        # run.sh builds a plaintext vortex site image and runs ZAP's packaged
        # zap-baseline.py against it over a private docker network. zap.conf
        # promotes the security-header rules the app satisfies to FAIL, so the
        # scan exits non-zero if a regression drops one of those headers. It
        # picks the x86_64 server base itself.
        run: sh conformance/zap/run.sh

  h2load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Load/stress smoke (h2load)
        # run.sh builds a plaintext vortex server image and an nghttp2 h2load
        # client image, then fires many concurrent h1 and h2c requests at it
        # over a private docker network; it fails on any failed/errored/timed-out
        # or non-2xx request. It picks the x86_64 server base itself.
        run: sh conformance/h2load/run.sh

  h3load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HTTP/3 load/throughput (h2load-http3)
        # run.sh builds a vortex HTTP/3 server image and an h2load client image
        # built with HTTP/3 (ngtcp2 + nghttp3 on OpenSSL >= 3.5, from source),
        # then drives many concurrent QUIC connections/streams at it, printing
        # req/s (a real QUIC client, so the number reflects the server) and
        # failing on any failed/errored/timed-out or non-2xx request. It picks
        # the x86_64 base itself.
        run: sh conformance/h3load/run.sh

  testssl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: TLS scan (testssl.sh)
        # run.sh builds a vortex TLS server image and runs drwetter/testssl.sh
        # against it over a private docker network (protocols/ciphers/vulns); it
        # fails on any HIGH/CRITICAL finding. It picks the x86_64 server base
        # itself.
        run: sh conformance/testssl/run.sh

  interop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mtls: [0, 1]
    name: interop (mtls=${{ matrix.mtls }})
    steps:
      - uses: actions/checkout@v7
      - name: Cross-client interop (Node/Python/Go/Rust/Java)
        # run.sh mints a shared CA, builds a vortex TLS+gzip server image and
        # five language-client images, then drives every HTTP method from each
        # client over HTTP/2 with gzip (sequentially), asserting h2 + gzip
        # round-trip; it fails if any backend errors. mtls=1 additionally
        # requires + presents client certs and checks /whoami. It picks the
        # x86_64 server base itself; short runtime keeps CI quick.
        run: >-
          INTEROP_RUNTIME=3 INTEROP_CLIENTS=5 INTEROP_MTLS=${{ matrix.mtls }}
          sh conformance/interop/run.sh

  brotli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cross-client brotli (Node/Python/Go/Rust/Java)
        # Same harness as interop, but every client requests and asserts
        # Content-Encoding: br. The server is built -d:httpBrotli and each client
        # decodes brotli with its ecosystem's library. It picks the x86_64 server
        # base itself; short runtime keeps CI quick.
        run: >-
          INTEROP_ENCODING=br INTEROP_RUNTIME=3 INTEROP_CLIENTS=5
          sh conformance/interop/run.sh

  # --- Memory / race scenario matrix (conformance/memcheck/harness.nim) --------
  # Self-driving server+client scenarios under valgrind memcheck, helgrind, and
  # ThreadSanitizer, across backends (sync/async/chronos) and memory managers.
  # Built -d:plainHttp (no OpenSSL) so the tools run cleanly; scenarios are
  # cleartext. See conformance/memcheck/run.sh.
  valgrind:
    name: valgrind / ${{ matrix.scenario }} / ${{ matrix.target }} / ${{ matrix.mm }}
    runs-on: ubuntu-latest
    # Debian-based nim image: Arch ships a stripped ld.so that valgrind can't set
    # up its mandatory memcmp redirection against. -d:plainHttp means no OpenSSL,
    # so we don't need Arch's OpenSSL >= 3.5 here.
    container: nimlang/nim
    strategy:
      fail-fast: false
      matrix:
        scenario: [http1, http1c, http2, http2c, streamup, streamdown, streamdownc, sse, ws, shutdown]
        target: [sync, async, chronos]
        mm: [orc]
    steps:
      - name: Install toolchain
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          valgrind libc6-dbg gcc git curl zlib1g-dev ca-certificates
      - uses: actions/checkout@v7
      - name: Install chronos
        if: matrix.target == 'chronos'
        # Retry: nimble fetches chronos's deps from several git remotes, which
        # occasionally hit a transient TLS/network error across the 30 chronos
        # cells.
        run: |
          ok=
          for i in 1 2 3; do
            if nimble install -y "chronos@>= 4.0.0"; then ok=1; break; fi
            echo "chronos install attempt $i failed; retrying in 5s"; sleep 5
          done
          [ -n "$ok" ] || { echo "chronos install failed after retries"; exit 1; }
      - name: memcheck
        run: >-
          TOOL=valgrind SCENARIO=${{ matrix.scenario }}
          TARGET=${{ matrix.target }} MM=${{ matrix.mm }}
          bash conformance/memcheck/run.sh

  helgrind:
    name: helgrind / ${{ matrix.scenario }} / ${{ matrix.target }} / ${{ matrix.mm }}
    runs-on: ubuntu-latest
    # Debian-based (see valgrind job): Arch's stripped ld.so breaks valgrind.
    container: nimlang/nim
    strategy:
      fail-fast: false
      matrix:
        scenario: [http1, http1c, http2, http2c, streamup, streamdown, streamdownc, sse, ws, shutdown]
        target: [sync, async, chronos]
        mm: [orc]
    steps:
      - name: Install toolchain
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          valgrind libc6-dbg gcc git curl zlib1g-dev ca-certificates
      - uses: actions/checkout@v7
      - name: Install chronos
        if: matrix.target == 'chronos'
        # Retry: nimble fetches chronos's deps from several git remotes, which
        # occasionally hit a transient TLS/network error across the 30 chronos
        # cells.
        run: |
          ok=
          for i in 1 2 3; do
            if nimble install -y "chronos@>= 4.0.0"; then ok=1; break; fi
            echo "chronos install attempt $i failed; retrying in 5s"; sleep 5
          done
          [ -n "$ok" ] || { echo "chronos install failed after retries"; exit 1; }
      - name: helgrind
        run: >-
          TOOL=helgrind SCENARIO=${{ matrix.scenario }}
          TARGET=${{ matrix.target }} MM=${{ matrix.mm }}
          bash conformance/memcheck/run.sh

  tsan:
    name: tsan / ${{ matrix.scenario }} / ${{ matrix.target }} / ${{ matrix.mm }}
    runs-on: ubuntu-latest
    # Privileged to lower mmap randomization for ThreadSanitizer's shadow
    # mapping (same as the sanitize/testrace jobs).
    container:
      image: archlinux:latest
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        scenario: [http1, http1c, http2, http2c, streamup, streamdown, streamdownc, sse, ws, shutdown]
        target: [sync, async, chronos]
        mm: [orc]
    steps:
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sysctl -w vm.mmap_rnd_bits=28 || true
      - name: Install toolchain
        run: >-
          pacman -Syu --noconfirm --needed --disable-sandbox
          nim gcc git zlib curl
      - uses: actions/checkout@v7
      - name: Install chronos
        if: matrix.target == 'chronos'
        # Retry: nimble fetches chronos's deps from several git remotes, which
        # occasionally hit a transient TLS/network error across the 30 chronos
        # cells.
        run: |
          ok=
          for i in 1 2 3; do
            if nimble install -y "chronos@>= 4.0.0"; then ok=1; break; fi
            echo "chronos install attempt $i failed; retrying in 5s"; sleep 5
          done
          [ -n "$ok" ] || { echo "chronos install failed after retries"; exit 1; }
      - name: tsan
        run: >-
          TOOL=tsan SCENARIO=${{ matrix.scenario }}
          TARGET=${{ matrix.target }} MM=${{ matrix.mm }}
          bash conformance/memcheck/run.sh
