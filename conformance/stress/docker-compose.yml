# Long-lived observability stack for the k6 stress harness: Prometheus (with the
# remote-write receiver enabled so k6 can push metrics) and Grafana (anonymous
# admin, provisioned datasource + dashboard). run.sh brings this up and leaves it
# running so the charts stay viewable after a run; `run.sh --down` (add -v to drop
# retained history) stops it.
#
# The network is given a fixed name so run.sh can attach the per-backend server
# and the k6 client to it with `docker run --network vortex-stress`.

name: vortex-stress

networks:
  default:
    name: vortex-stress

volumes:
  prom-data:
  grafana-data:

services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      # Native histograms keep k6's Prometheus output memory-flat at high req/s
      # (it ships a compact histogram instead of aggregating a raw-sample
      # firehose each flush, which otherwise OOMs k6 on long, fast runs).
      - --enable-feature=native-histograms
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
