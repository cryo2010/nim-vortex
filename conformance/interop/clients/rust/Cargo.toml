[package]
name = "vortex-interop-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "client"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = true, features = ["gzip", "http2", "native-tls", "native-tls-alpn"] }

[profile.release]
opt-level = 2
