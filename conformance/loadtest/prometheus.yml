# k6 pushes its client-side metrics via remote write (the receiver is enabled by
# the --web.enable-remote-write-receiver flag in docker-compose.yml). The server
# container's own CPU/memory come from run.sh sampling `docker stats` and pushing
# to the Pushgateway, which Prometheus scrapes here (honor_labels keeps the job
# label set on the push so the dashboard can select the server series).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pushgateway
    honor_labels: true
    scrape_interval: 2s
    static_configs:
      - targets: ['pushgateway:9091']
