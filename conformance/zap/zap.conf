# OWASP ZAP baseline rule configuration (zap-baseline.py -c zap.conf).
#
# Format:  <rule_id>	<IGNORE|WARN|FAIL>	[url_regex]  (tab separated)
#
# The baseline scan flags every finding as WARN by default; run.sh passes -I
# so warnings do not fail the run. This file promotes the security-header
# rules that vortex's target app satisfies to FAIL, turning the scan into a
# regression gate: if a future change stops emitting one of these headers, the
# corresponding rule fires and fails the build. HTTPS-only rules are ignored
# because the scan runs over plain HTTP on the private docker network.

# --- promoted to FAIL: security response headers the app must always set ---
10015	FAIL	# Re-examine Cache-control Directives
10020	FAIL	# Missing Anti-clickjacking Header (X-Frame-Options / CSP)
10021	FAIL	# X-Content-Type-Options Header Missing
10038	FAIL	# Content Security Policy (CSP) Header Not Set
10063	FAIL	# Permissions Policy Header Not Set
90004	FAIL	# Insufficient Site Isolation Against Spectre Vulnerability

# --- ignored: not applicable to a plain-HTTP scan ---
10035	IGNORE	# Strict-Transport-Security Header (HTTPS only)
