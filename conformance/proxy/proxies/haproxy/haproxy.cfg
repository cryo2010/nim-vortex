# HAProxy reverse proxy in front of the vortex origin (proxy interop suite).
# Terminates client TLS (h1/h2, plus h3 when the image has QUIC) and forwards
# HTTP/1.1 to vortex:8080. run.sh materializes the two placeholders:
#   __QUIC_BIND__  -> a `bind quic4@:8443 ...` line (h3) or removed
#   __SENDPROXY__  -> `send-proxy-v2` for the PROXY-protocol check, else empty
# WebSocket Upgrade and streaming are handled natively in http mode.
global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option http-keep-alive
    timeout connect 5s
    timeout client 3600s
    timeout server 3600s
    timeout tunnel 3600s

frontend fe
    bind :8443 ssl crt /certs/proxy.pem alpn h2,http/1.1
__QUIC_BIND__
    http-response set-header alt-svc "h3=\":8443\"; ma=86400"
    default_backend be

backend be
    server vortex vortex:8080 __SENDPROXY__
