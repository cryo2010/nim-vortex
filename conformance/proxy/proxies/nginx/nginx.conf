# nginx reverse proxy in front of the vortex origin (proxy interop suite).
# Terminates client TLS + h1/h2/h3 and re-originates HTTP/1.1 (keep-alive) to
# the vortex origin at http://vortex:8080. WebSocket Upgrade is forwarded;
# response/request buffering is disabled for SSE and streaming so those pass
# through unbuffered.
worker_processes 1;
events { worker_connections 1024; }

http {
    upstream vortex { server vortex:8080; keepalive 32; }

    # WebSocket Upgrade: map the Upgrade header to the upstream Connection value.
    map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

    server {
        listen 8443 ssl;
        listen 8443 quic reuseport;   # HTTP/3 (nginx >= 1.25 with http_v3)
        http2 on;
        http3 on;

        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Interop needs the origin, not nginx, to set the ceiling: allow the 8 MiB
        # streamupload (default is 1m -> 413) and don't recycle the connection
        # mid-test (default keepalive_requests 1000 -> GOAWAY / H3_NO_ERROR while a
        # short soak hammers thousands of requests on one h2/h3 connection).
        client_max_body_size 0;
        keepalive_requests   1000000;

        add_header Alt-Svc 'h3=":8443"; ma=86400' always;

        location / {
            proxy_pass http://vortex;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";        # reuse upstream keep-alive
        }

        location /ws {
            proxy_pass http://vortex;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        location /sse {
            proxy_pass http://vortex;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;                    # deliver events immediately
            proxy_cache off;
        }

        location /download {
            proxy_pass http://vortex;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;                    # stream the body through
        }

        location /upload {
            proxy_pass http://vortex;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_request_buffering off;            # stream the request body
        }
    }
}
